<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classic Todo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Po to żeby po wejściu na strone nie flickerowalo -->
    <!-- Ten skrypt ładuje się przed stylem -->
    <script>
      document.documentElement.classList.add('no-transition');
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <link rel="stylesheet" href="./src/style/style.scss" />
    <script type="module" src="./src/js/controller.js"></script>
  </head>

        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-sun-medium preview-icon theme-btn"

        <circle cx="12" cy="12" r="4" />

      <div class="todo__container">
        <header class="todo__header">
          <h1 class="todo__header--title">

                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-list-checks preview-icon"
              >
                <path d="M13 5h8" />
                <path d="M13 12h8" />
                <path d="M13 19h8" />
                <path d="m3 17 2 2 4-4" />
                <path d="m3 7 2 2 4-4" />
              </svg>
            </span>
          </h1>
        </header>

              <path d="M3 6h18" />
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />

        </ul>
        <div class="todo__toolbar">
          <input
            type="text"
            name="todo__input-add"
            class="todo__input-add"
            id="todo__input-add"
            placeholder="Enter new task..."
          />
          <button class="todo__button-add btn primary--btn">Add to list</button>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="38"
            height="38"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-funnel preview-icon toolbar-icon filter-btn"
            id="filter-btn"
          >
            <path
              d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"
            />
          </svg>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="38"
            height="38"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.1"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-trash preview-icon toolbar-icon delete-btn"
            id="delete-btn"
          >
            <path d="M10 11v6" />
            <path d="M14 11v6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M3 6h18" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        </div>
      </div>
      <div class="modal-confirm__overlay">
        <div class="modal-confirm">
          <div class="modal-confirm__content">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="54"
              height="54"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-triangle-alert preview-icon modal-icon"
            >
              <path
                d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"
              />
              <path d="M12 9v4" />
              <path d="M12 17h.01" />
            </svg>
            <p class="modal-confirm__message">
              Are you sure? The task is not finished.
            </p>
          </div>
          <div class="modal-confirm__btns-container">
            <button class="modal-confirm__accept-btn btn primary--btn">
              YES
            </button>
            <button class="modal-confirm__reject-btn btn secondary--btn">
              NO
            </button>
          </div>
        </div>
      </div>
      <div class="modal-menu__overlay">
        <ul class="modal-menu">
          <li>
            <button class="modal-menu__item modal-menu__highlight-btn">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="26"
                height="26"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-highlighter preview-icon"
              >
                <path d="m9 11-6 6v3h9l3-3" />
                <path
                  d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"
                /></svg
              >Mark Inportant
            </button>
          </li>
          <li>
            <button class="modal-menu__item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="23"
                height="23"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-pen-line preview-icon"
              >
                <path d="M13 21h8" />
                <path
                  d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
                />
              </svg>
              Edit
            </button>
          </li>
        </ul>
      </div>
    </main>

</html>
